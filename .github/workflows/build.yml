name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore LanBridge.sln

      - name: Build
        run: dotnet build LanBridge.sln -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test LanBridge.sln -c Release --no-build

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @("install.ps1", "uninstall.ps1", "build.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file`: $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { throw "PowerShell validation failed." }
